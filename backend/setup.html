<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClaimsFlow Setup</title><style>body{font:16px system-ui;background:#f5f7fb;margin:8vh auto;max-width:430px;padding:20px}main{background:white;padding:30px;border-radius:14px;box-shadow:0 4px 20px #0001}input,button{box-sizing:border-box;width:100%;padding:12px;margin:8px 0 16px;border:1px solid #aaa;border-radius:6px}button{background:#1546a0;color:white;cursor:pointer}small{color:#555}</style><main><h1>ClaimsFlow</h1><h2>First-time setup</h2><p>Create your account here. No Terminal commands needed.</p><form id="f"><label>Username<input id="u" autocomplete="username" required pattern="[A-Za-z0-9_-]+"></label><label>Password (12+ characters)<input id="p" type="password" minlength="12" autocomplete="new-password" required></label><button>Create account</button></form><p id="status" role="status"></p><small>Setup is available only from this Mac. Uses synthetic claims data.</small></main><script>document.getElementById('f').onsubmit=async e=>{e.preventDefault();const status=document.getElementById('status');status.textContent='Creating account...';try{const r=await fetch('/api/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('u').value,password:document.getElementById('p').value})});const j=await r.json();if(!r.ok)throw Error(j.detail||'Setup failed');location.href='/login'}catch(err){status.textContent=err.message}}</script></html>
