<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClaimsFlow — Account settings</title><style>body{font:16px system-ui;background:#f3f6fb;max-width:680px;margin:5vh auto;padding:20px}main,section{background:white;padding:24px;border-radius:12px;margin-bottom:16px}label{display:block;margin:12px 0}input,select,button{padding:10px;box-sizing:border-box;max-width:100%;margin:4px}button{background:#173d6c;color:white;border:0;border-radius:6px;cursor:pointer}#msg{white-space:pre-wrap}a{color:#173d6c}</style><main><h1>Account settings</h1><p id="who"></p><p><a href="/">Return to ClaimsFlow</a></p><p id="msg" role="status"></p></main><section><h2>Change my password</h2><form id="change"><label>Current password <input type="password" name="current_password" required></label><label>New password (12+ characters) <input type="password" name="new_password" minlength="12" required></label><button>Change password</button></form></section><section id="admin" hidden><h2>Manage accounts</h2><p>Create an account for remote access or reset an existing account password.</p><form id="create"><label>New username <input name="username" pattern="[A-Za-z0-9_-]+" required></label><label>Temporary password (12+ characters) <input type="password" name="password" minlength="12" required></label><label>Role <select name="role"><option value="analyst">Analyst</option><option value="admin">Administrator</option></select></label><button>Create account</button></form><h3>Existing accounts</h3><div id="users"></div></section><script>
const msg=document.querySelector('#msg');async function call(path,method,body){const r=await fetch(path,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let j=await r.json();if(!r.ok)throw Error(j.detail||'Request failed');return j}
async function load(){let me=await(await fetch('/api/me')).json();document.querySelector('#who').textContent='Signed in as '+(me.username||'');if(!me.username){location.href='/login';return}try{const data=await(await fetch('/api/admin/users')).json();if(!data.users)return;document.querySelector('#admin').hidden=false;const box=document.querySelector('#users');box.replaceChildren();data.users.forEach(u=>{let p=document.createElement('p');let label=document.createElement('span');label.textContent=u.username+' ('+u.role+') ';let btn=document.createElement('button');btn.textContent='Reset password';btn.onclick=async()=>{let pw=prompt('Enter a new password (at least 12 characters) for '+u.username);if(pw===null)return;try{await call('/api/admin/users/'+encodeURIComponent(u.username)+'/password','POST',{new_password:pw});msg.textContent='Password reset for '+u.username}catch(e){msg.textContent=e.message}};p.append(label,btn);box.append(p)})}catch(e){}}
document.querySelector('#change').onsubmit=async e=>{e.preventDefault();try{await call('/api/account/password','POST',Object.fromEntries(new FormData(e.target)));location.href='/login'}catch(err){msg.textContent=err.message}};
document.querySelector('#create').onsubmit=async e=>{e.preventDefault();try{await call('/api/admin/users','POST',Object.fromEntries(new FormData(e.target)));msg.textContent='Account created';e.target.reset();await load()}catch(err){msg.textContent=err.message}};load();</script></html>
