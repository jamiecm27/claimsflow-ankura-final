<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClaimsFlow — Sign in</title><style>body{font:16px system-ui;background:#f3f6fb;display:grid;place-items:center;min-height:90vh}main{background:white;padding:2rem;border-radius:12px;box-shadow:0 6px 32px #0001;width:min(90vw,390px)}label{display:block;margin-top:1rem}input,button{box-sizing:border-box;width:100%;padding:.75rem;margin-top:.35rem}button{background:#173d6c;color:white;border:0;border-radius:6px;margin-top:1.5rem;cursor:pointer}a{color:#173d6c}#error{color:#a22}</style><main><h1>ClaimsFlow</h1><p>Sign in to your account</p><form id="login"><label>Username<input name="username" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button>Sign in</button><p id="error" role="alert"></p></form><p><a href="/forgot-password">Forgot password or first-time setup?</a></p></main><script>document.querySelector('form').addEventListener('submit',async e=>{e.preventDefault();const form=new FormData(e.target);try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(form))});if(r.ok)location.assign('/');else {const data=await r.json();document.querySelector('#error').textContent=data.detail||'Sign-in failed.'}}catch(err){document.querySelector('#error').textContent='Cannot reach the Mac mini. Check ZeroTier and try again.'}})</script></html>
